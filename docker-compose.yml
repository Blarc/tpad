services:
  tpad:
    build: .
    image: tpad:local
    user: "${TPAD_UID:-1000}:${TPAD_GID:-1000}"
    ports:
      - "${TPAD_PORT:-8080}:8080"
    environment:
      TPAD_DATA_DIR: /data
      TPAD_LISTEN_ADDR: 0.0.0.0:8080
      TPAD_MAX_FILE_BYTES: "${TPAD_MAX_FILE_BYTES:-2097152}"
      TPAD_AUTH_USERNAME: "${TPAD_AUTH_USERNAME:-}"
      TPAD_AUTH_PASSWORD: "${TPAD_AUTH_PASSWORD:-}"
    volumes:
      - ./tpad:/data
    restart: unless-stopped

